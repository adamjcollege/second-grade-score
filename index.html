<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turbo Score">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="description" content="Step-by-step 2nd and 3rd grade math, reading, spelling, and writing practice with Turbo the monster truck and Brix the brick buddy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<title>Turbo Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Lexend:wght@400;500;600;700&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a night stadium under the lights, with one bright graph-paper notebook where the work happens; place values get their own color stripes */
:root{
  --space:#0a1626; --space-2:#13263d; --space-3:#1c3755; --space-line:#2b4a6e;
  --ink:#f3f8ff; --ink-dim:#b5c6dc;
  --paper:#fbfdff; --paper-line:#e3ecf6; --paper-ink:#14243a; --paper-dim:#5b6b80;
  --pink:#ff6b3d; --pink-ink:#c2380f; --gold:#ffd23f; --gold-soft:#fff3c2;
  --mint:#36d07b; --good-ink:#0b7a45; --good-soft:#e2f8ec; --sky:#4fb3ff; --lav:#8fb0ff; --coral:#ff8f6b; --coral-ink:#c2461f; --coral-soft:#fff0ea;
  --t0:#e1f2ff; --t1:#e3f9ec; --t2:#fff0d6; --t3:#fde4f4; --t4:#eee6ff; --t5:#ffe9e1;
  --p0:#1f6fb3; --p1:#178a50; --p2:#b56b00; --p3:#b8337f; --p4:#6a4fd1; --p5:#b5451f;
  --font-logo:"Bungee","Lilita One",sans-serif;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-hand:"Andika","Century Gothic","Segoe UI",sans-serif;
  --cell:clamp(2.4rem,9vw,3.5rem);
  color-scheme:dark;
}
html,body{min-height:100%}
/* phones: taps never zoom, long-presses don't select text or pop menus, no pull-to-refresh mid-mission */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,.btn,[data-act],#pad,.tab,.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:#fff;color:#14243a;font-weight:600;padding:.6em 1.1em;border-radius:999px;box-shadow:0 6px 24px #0006;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
body{background:var(--space);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0}
.btn{border:0;border-radius:999px;padding:.7em 1.3em;font-weight:600;font-size:1rem;background:var(--space-3);color:var(--ink);box-shadow:inset 0 0 0 2px var(--space-line);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn-hot{background:var(--pink);color:#3a1205;box-shadow:0 5px 0 #c2471f}
.btn-gold{background:var(--gold);color:#3a2700;box-shadow:0 5px 0 #c49a12}
.btn-mint{background:var(--mint);color:#063b2e;box-shadow:0 5px 0 #1e9d7f}
.btn-hot:active,.btn-gold:active,.btn-mint:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.icon-btn{border:0;background:var(--space-2);box-shadow:inset 0 0 0 2px var(--space-line);border-radius:999px;padding:.45em .9em;font-size:.9rem;font-weight:500}

/* ---------- Home ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.star-total{display:inline-flex;align-items:center;gap:.4em;background:var(--space-2);border-radius:999px;padding:.35em .9em;font-weight:600;box-shadow:inset 0 0 0 2px var(--space-line)}
.star-total b{color:var(--gold);font-size:1.15rem;font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:18px 4px}
.hero h1{font-family:var(--font-logo);font-size:clamp(2.2rem,7.5vw,4rem);line-height:1}
.hero h1 .u{color:var(--pink)} .hero h1 .r{color:var(--gold)}
.hero p.lead{font-size:1.1rem;color:var(--ink-dim);max-width:40ch;margin:.5em 0 .9em}
.pilot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pilot-name{font-size:1.25rem;font-weight:600}
.pilot-name span{color:var(--mint)}
#name-form{display:flex;gap:8px;flex-wrap:wrap}
#name-input{font:inherit;font-size:1.05rem;padding:.5em .9em;border-radius:999px;border:2px solid var(--lav);background:var(--space-2);color:var(--ink);width:12em;max-width:100%}
.hero-art{display:flex;justify-content:center;align-items:flex-end;gap:4px}
.hero-art svg{height:auto;overflow:visible}
.hero-art .rk{width:min(230px,46vw)}
.hero-art .bt{width:min(100px,20vw);margin-bottom:6px}
.float{animation:float 4s ease-in-out infinite}
.bounce{animation:bounce 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-4deg)}55%{transform:translateY(0) scaleY(.94)}}
.float2{animation:float 3.4s ease-in-out .6s infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
.flame{transform-origin:100px 205px;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(1.18) scaleX(.92)}}

.plan{margin-top:18px;background:linear-gradient(120deg,var(--space-2),var(--space-3));border-radius:24px;padding:16px 18px;box-shadow:inset 0 0 0 2px var(--space-line)}
.plan-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.plan-head h2{font-size:1.5rem}
.plan-head p{margin:0;color:var(--ink-dim);font-size:.92rem}
.plan-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.plan-go{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:18px;padding:12px 14px;background:var(--space);box-shadow:inset 0 0 0 2px var(--space-line);transition:transform .12s,box-shadow .12s;min-width:0}
.plan-go:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--gold)}
.plan-go .badge{width:46px;height:46px;font-size:1.4rem}
.plan-go small{display:block;color:var(--ink-dim);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.plan-go b{display:block;font-size:1.02rem}
.plan-go span.lvlname{font-size:.85rem;color:var(--mint)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:8px;background:var(--space)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--space)}
.tab{border:0;border-radius:999px;padding:.6em 1.15em;font-weight:700;font-size:1rem;background:var(--space-2);box-shadow:inset 0 0 0 2px var(--space-line);color:var(--ink-dim)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--space);box-shadow:none}
.pane{padding-top:4px}
.zone-intro{display:flex;gap:14px;align-items:center;margin:12px 0 4px;color:var(--ink-dim)}
.zone-intro svg{width:54px;height:62px;flex:none}
.zone-intro p{margin:0;max-width:60ch}
.sector{margin-top:24px}
.sector-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sector-head h3{font-size:1.5rem}
.sector-head p{margin:0;color:var(--ink-dim);font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{background:linear-gradient(170deg,var(--space-2),var(--space));border-radius:22px;padding:16px;box-shadow:inset 0 0 0 2px var(--space-line);display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard-top{display:flex;gap:12px;align-items:center;min-width:0}
.mcard-top>div{min-width:0}
.badge{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:1.6rem;color:#14243a;position:relative;background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 19%),var(--bc)}
.badge::after{content:"";position:absolute;inset:4px;border:2px dashed #ffffff99;border-radius:50%}
.mcard h4{font-size:1.25rem}
.mcard .skill{margin:2px 0 0;color:var(--ink-dim);font-size:.88rem;line-height:1.35}
.stds{display:flex;flex-wrap:wrap;gap:4px}
.std{font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:.15em .5em;border-radius:6px;background:var(--space-3);color:var(--lav)}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto}
.lv{border:0;border-radius:12px;padding:.45em .25em;background:var(--space-3);box-shadow:inset 0 0 0 2px var(--space-line);display:flex;flex-direction:column;align-items:center;font-size:.78rem;font-weight:700;line-height:1.25;transition:transform .12s,box-shadow .12s}
.lv:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--lav)}
.lv .st{color:var(--gold);font-size:.95rem;letter-spacing:.06em}
.st .off{color:var(--space-line)}

.trophies{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;background:var(--space-2);border-radius:24px;padding:20px 14px;box-shadow:inset 0 0 0 2px var(--space-line)}
.trophy{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.trophy svg{width:clamp(40px,7vw,64px);height:auto;filter:drop-shadow(0 0 12px #ffd23f55)}
.trophy.locked svg{filter:grayscale(1) brightness(.45)}
.planet-name{font-weight:600;font-size:.88rem;line-height:1.2}
.planet-need{font-size:.75rem;color:var(--ink-dim)}
.trophy.here .planet-need{color:var(--mint);font-weight:600}
.hangar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr);gap:20px;align-items:start}
.robot-bay{background:var(--space-2);border-radius:24px;padding:18px;box-shadow:inset 0 0 0 2px var(--space-line);display:flex;flex-direction:column;align-items:center;gap:10px}

.gu{display:grid;gap:18px}
.gu-card{background:var(--space-2);border-radius:20px;padding:16px 20px;box-shadow:inset 0 0 0 2px var(--space-line)}
.gu-card h3{font-size:1.35rem;margin-bottom:.4em}
.gu-card p,.gu-card li{color:var(--ink-dim);max-width:75ch}
.gu-card b{color:var(--ink)}
.table-wrap{overflow-x:auto;border-radius:14px}
table.cov{border-collapse:collapse;width:100%;font-size:.88rem}
table.cov th,table.cov td{text-align:left;padding:.5em .7em;border-bottom:1px solid var(--space-line);vertical-align:top}
table.cov th{color:var(--gold);font-weight:600;letter-spacing:.04em;font-size:.78rem;text-transform:uppercase}
table.cov td.code{font-weight:700;white-space:nowrap;color:var(--lav)}
table.cov tr.sub td{background:var(--space);color:var(--gold);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.pill{display:inline-block;padding:.1em .6em;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill.in{background:#1f5f4f;color:#bff5e2}.pill.part{background:#5b4a16;color:#ffe9a8}.pill.off{background:#2f3f6e;color:#d6e0ff}
.linkish{border:0;background:none;padding:0;color:var(--sky);text-decoration:underline;font:inherit;font-size:inherit}
.reset-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- Mission ---------- */
.m-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.m-title{display:flex;flex-direction:column;min-width:0}
.m-title h2{font-size:1.6rem}
.m-title .eyebrow{color:var(--lav)}
.fuel{display:flex;align-items:center;gap:10px}
.fuel-label{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.fuel-cells{display:flex;gap:5px;flex-wrap:wrap}
.fuel-cells i{width:22px;height:16px;border-radius:5px;background:var(--space-3);box-shadow:inset 0 0 0 2px var(--space-line);transition:background .3s}
.fuel-cells i.on{background:linear-gradient(90deg,var(--gold),var(--pink));box-shadow:0 0 10px -2px var(--pink)}
.m-body{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;margin-top:16px;align-items:start}
.m-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.helper{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--space-3),var(--space-2));box-shadow:inset 0 0 0 3px var(--lav);display:grid;place-items:center;animation:bob 3s ease-in-out infinite}
.avatar svg{width:56px;height:64px}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble{position:relative;background:var(--ink);color:var(--paper-ink);border-radius:20px;padding:14px 18px;font-size:1.1rem;line-height:1.45;min-height:72px;flex:1;min-width:0;box-shadow:0 0 0 4px var(--lav)}
.bubble::before{content:"";position:absolute;left:-10px;top:24px;border:10px solid transparent;border-left:0;border-right-color:var(--lav)}
.bubble b{color:var(--pink-ink)}
.bubble small{font-size:.88rem;color:var(--paper-dim)}
.helper.oops .bubble{box-shadow:0 0 0 4px var(--coral)} .helper.oops .bubble::before{border-right-color:var(--coral)} .helper.oops .avatar{box-shadow:inset 0 0 0 3px var(--coral)}
.helper.cheer .bubble{box-shadow:0 0 0 4px var(--mint)} .helper.cheer .bubble::before{border-right-color:var(--mint)} .helper.cheer .avatar{box-shadow:inset 0 0 0 3px var(--mint)}
.helper.think .bubble{box-shadow:0 0 0 4px var(--gold)} .helper.think .bubble::before{border-right-color:var(--gold)} .helper.think .avatar{box-shadow:inset 0 0 0 3px var(--gold)}
.notebook{background-color:var(--paper);background-image:linear-gradient(var(--paper-line) 2px,transparent 2px),linear-gradient(90deg,var(--paper-line) 2px,transparent 2px);background-size:28px 28px;color:var(--paper-ink);border-radius:24px;padding:24px 16px;box-shadow:0 18px 40px -18px #000a,inset 0 0 0 3px #fff;overflow-x:auto;min-height:280px;display:flex;flex-direction:column;align-items:center;gap:18px;color-scheme:light}
.m-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--space-2);padding:12px;border-radius:22px;box-shadow:inset 0 0 0 2px var(--space-line)}
.pad button{border:0;border-radius:14px;min-height:56px;font-family:var(--font-display);font-size:1.8rem;background:var(--space-3);color:var(--ink);box-shadow:0 4px 0 #06101c;transition:transform .08s}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #06101c}
.pad button:disabled{opacity:.35;cursor:default}
.pad .k-back{font-size:1.3rem;color:var(--coral)}
.pad .k-check{background:var(--mint);color:#063b2e;font-size:1.2rem;box-shadow:0 4px 0 #1e9d7f}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-actions .btn{padding:.65em .6em}
#next{width:100%;font-size:1.2rem;padding:.8em}
.manual{background:var(--space-2);border-radius:20px;padding:16px 18px;box-shadow:inset 0 0 0 2px var(--gold)}
.manual h3{font-size:1.25rem;color:var(--gold);margin-bottom:.4em}
.manual ol,.manual ul{margin:0;padding-left:1.2em;display:grid;gap:.45em}
.manual p{margin:.6em 0 0;color:var(--ink-dim);font-size:.95rem}

/* place-value tints */
.pl-0{--tint:var(--t0);--pc:var(--p0)} .pl-1{--tint:var(--t1);--pc:var(--p1)} .pl-2{--tint:var(--t2);--pc:var(--p2)} .pl-3{--tint:var(--t3);--pc:var(--p3)} .pl-4{--tint:var(--t4);--pc:var(--p4)} .pl-5{--tint:var(--t5);--pc:var(--p5)}

/* column arithmetic */
.sub-grid{display:grid;grid-template-columns:calc(var(--cell)*.7) repeat(var(--n),var(--cell));column-gap:5px;font-variant-numeric:tabular-nums}
.sg{display:grid;place-items:center;background:var(--tint,transparent)}
.sg-label{font-size:.72rem;font-weight:700;color:var(--pc);border-radius:12px 12px 0 0;padding-top:6px;white-space:nowrap}
.sg-marks{height:calc(var(--cell)*.62);font-size:calc(var(--cell)*.36);color:var(--pink-ink);font-weight:700;display:flex;gap:4px;align-items:flex-end;justify-content:center}
.sg-marks s{opacity:.6;text-decoration-thickness:2px}
.sg-num{height:var(--cell);font-size:calc(var(--cell)*.66);font-weight:600}
.sg-sign{background:transparent;font-size:calc(var(--cell)*.6)}
.sg-rule{grid-column:1/-1;height:5px;background:var(--paper-ink);border-radius:3px;margin:4px 0}
.sg-ans{height:calc(var(--cell)*1.15);border-radius:0 0 12px 12px}
.tdig{border:0;background:transparent;font:inherit;font-weight:600;color:var(--paper-ink);width:88%;height:88%;border-radius:12px;transition:background .15s}
.tdig:hover{background:#fff}
.tdig.crossed{text-decoration:line-through;text-decoration-color:var(--pink-ink);text-decoration-thickness:4px;opacity:.6}
.glow{box-shadow:0 0 0 4px var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ffd23f66}}
.abox{width:84%;height:80%;border-radius:12px;border:3px dashed #b9cbe0;display:grid;place-items:center;font-size:calc(var(--cell)*.66);font-weight:700;background:#fff8}
.abox.active{border:3px solid var(--pink-ink);background:#fff}
.abox.done{border-color:transparent;background:transparent;color:var(--good-ink)}
.caret{display:inline-block;width:3px;height:.9em;background:var(--pink-ink);margin-left:2px;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.check-line{font-size:1.05rem;color:var(--good-ink);font-weight:600;text-align:center;margin:0}
.mul{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.expand{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:8px;font-size:clamp(1.4rem,5vw,2rem);font-weight:600;font-variant-numeric:tabular-nums}
.expand .whole span{color:var(--pc,var(--paper-ink))}
.part{min-width:2.4em;padding:.1em .35em;border-radius:12px;border:3px dashed var(--pc);background:var(--tint);text-align:center;color:var(--paper-dim)}
.part.active{border-style:solid;background:#fff;color:var(--paper-ink)}
.part.done{border-style:solid;color:var(--pc)}
.area{display:grid;gap:6px;width:100%;max-width:560px}
.area .hd{font-weight:700;font-size:1.15rem;display:grid;place-items:center;border-radius:12px;padding:.35em .5em;background:var(--tint,#e8f0fa);color:var(--pc,var(--paper-ink));font-variant-numeric:tabular-nums}
.area .corner{background:transparent;font-family:var(--font-display);font-size:1.6rem;color:var(--paper-dim)}
.box{background:#fff;border-radius:14px;border:3px solid #d3e0ee;padding:.5em .3em;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.box small{font-size:.78rem;color:var(--paper-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.box b{font-size:clamp(1.05rem,3.6vw,1.45rem);font-variant-numeric:tabular-nums;min-height:1.4em;color:var(--paper-dim)}
.box.active{border-color:var(--pink-ink);box-shadow:0 0 0 4px #ff6b3d33}
.box.active b{color:var(--paper-ink)}
.box.done{background:#effcf6;border-color:#9fe5cc}
.box.done b{color:var(--good-ink)}
button.box.tap{font:inherit;color:inherit;cursor:pointer;border-style:dashed}
button.box.tap:hover,button.box.tap:focus-visible{border-color:var(--pink);border-style:solid}
.col-wrap{display:flex;justify-content:center;margin:6px 0 4px;max-width:100%;overflow-x:auto}
.sg-num.cur{color:var(--pink-ink)}
.stack{display:grid;justify-items:end;font-size:clamp(1.3rem,4.6vw,1.8rem);font-weight:600;font-variant-numeric:tabular-nums;gap:2px}
.sline{display:flex;gap:.6em;align-items:center}
.sline .op{width:1em;color:var(--paper-dim)}
.srule{width:100%;height:5px;background:var(--paper-ink);border-radius:3px;margin:4px 0}
.total{min-width:4.5em;text-align:right;padding:0 .3em;border-radius:12px;border:3px dashed #b9cbe0}
.total.active{border:3px solid var(--pink-ink);background:#fff}
.total.done{border-color:transparent;color:var(--good-ink)}
.dmsb{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dmsb span{padding:.3em .8em;border-radius:999px;font-weight:600;font-size:.9rem;background:#e8f0fa;color:var(--paper-dim)}
.dmsb span.on{background:var(--pink-ink);color:#fff}
.dmsb-cap{font-size:.85rem;color:var(--paper-dim);margin:-10px 0 0;text-align:center}
.dmsb-cap b{color:var(--pink-ink)}
.ld{display:grid;grid-template-columns:repeat(var(--cols),var(--lc));grid-auto-rows:var(--lc);--lc:clamp(2.1rem,8.4vw,3.2rem);font-variant-numeric:tabular-nums}
.ldc{display:grid;place-items:center;font-size:calc(var(--lc)*.62);font-weight:600;position:relative}
.ldc.divisor{color:var(--pink-ink)}
.ldc.dd{border-top:5px solid var(--paper-ink)}
.ldc.dd-first{border-left:5px solid var(--paper-ink);border-top-left-radius:16px}
.ldc.q{color:var(--good-ink)}
.ldc.rlabel{font-size:calc(var(--lc)*.45)}
.ldc.under{border-bottom:4px solid var(--paper-ink)}
.ldc.minus{color:var(--paper-dim)}
.ldc.ghost{color:#a8b8cc}
.ldc.brought{color:var(--p0)}
.ldc.focus{background:var(--gold-soft);border-radius:8px}
.ldc.rem{color:var(--pink-ink)}
.ldc.slot::before{content:"";position:absolute;inset:4px;border:3px dashed var(--pink-ink);border-radius:10px;background:#fff8;z-index:-1}
.ldc.slot.caret-on::after{content:"";position:absolute;width:3px;height:45%;background:var(--pink-ink);animation:blink 1s steps(1) infinite}
.ld-wrap{position:relative;z-index:0;max-width:100%;overflow-x:auto}
.bring-btn{border:0;border-radius:999px;padding:.6em 1.2em;font-weight:700;font-size:1.05rem;background:var(--sky);color:#06304f;box-shadow:0 4px 0 #3d8fd0}
.helper-table{width:100%;max-width:560px}
.helper-table p{margin:0 0 6px;font-size:.85rem;font-weight:600;color:var(--paper-dim);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:.9rem;font-variant-numeric:tabular-nums;padding:.25em .65em;border-radius:999px;background:#e8f0fa;color:var(--paper-ink);white-space:nowrap}
.chip.glow{background:var(--gold-soft)}

/* generic questions */
.q{width:100%;max-width:680px;display:flex;flex-direction:column;gap:16px}
.q-text{font-size:1.18rem;line-height:1.6}
.q-text b{color:var(--pink-ink)}
.q-viz{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:1.25rem}
.viz{display:block;max-width:100%;height:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.choices.short{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.choice{display:flex;gap:10px;align-items:flex-start;border:3px solid #cfdcec;background:#fff;border-radius:16px;padding:.7em .9em;font:inherit;font-size:1.05rem;font-weight:500;color:var(--paper-ink);text-align:left;transition:border-color .15s,transform .12s;line-height:1.4}
.choice:hover:not(:disabled){border-color:var(--pink-ink);transform:translateY(-2px)}
.choice .ck{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:#e8f0fa;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--paper-dim)}
.choice.no{opacity:.45;text-decoration:line-through;border-style:dashed;cursor:default}
.choice.yes{border-color:var(--good-ink);background:var(--good-soft)}
.choices.locked .choice{opacity:.5;pointer-events:none}
.cmp-row{display:flex;gap:12px;justify-content:center}
.cmp-btn{width:76px;height:76px;border-radius:20px;border:3px solid #cfdcec;background:#fff;font-family:var(--font-display);font-size:2.4rem;color:var(--paper-ink)}
.cmp-btn:hover:not(:disabled){border-color:var(--pink-ink)}
.cmp-btn.no{opacity:.35;border-style:dashed}
.cmp-line{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:clamp(1.4rem,5vw,2.1rem);font-weight:700;font-variant-numeric:tabular-nums}
.cmp-slot{width:1.6em;height:1.6em;border-radius:14px;border:3px dashed var(--pink-ink);display:grid;place-items:center;color:var(--good-ink)}
.records{display:grid;gap:4px}
.rec{color:var(--good-ink);font-weight:600}
.ans-row{display:flex;align-items:center;gap:10px;justify-content:center;font-size:1.3rem;font-weight:600;flex-wrap:wrap}
.numbox{min-width:2.4em;min-height:1.6em;padding:.05em .35em;border-radius:12px;border:3px dashed #b9cbe0;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;vertical-align:middle}
.numbox.active{border:3px solid var(--pink-ink)}
.numbox.done{border-color:transparent;color:var(--good-ink);background:transparent}
.after{background:var(--good-soft);border-radius:14px;padding:.7em 1em;color:#0b5c48;font-weight:500}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.pk{border:2px solid #cfdcec;background:#fff;border-radius:10px;min-height:44px;font-weight:700;font-size:1.05rem;color:var(--paper-ink)}
.pk.on{background:var(--pink-ink);border-color:var(--pink-ink);color:#fff}
.check-btn{align-self:center}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-weight:700;margin:0 .12em;font-variant-numeric:tabular-nums}
.frac>span:first-child{border-bottom:3px solid currentColor;padding:0 .2em .08em;min-width:1em;text-align:center}
.frac>span:last-child{padding-top:.08em}
.frac .numbox{font-size:.95em;min-width:1.6em;min-height:1.3em}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:clamp(1.4rem,5vw,2rem);font-weight:700}
.pv{border-collapse:separate;border-spacing:4px;font-variant-numeric:tabular-nums}
.pv th{font-size:.72rem;color:var(--pc);padding:.2em .4em;background:var(--tint);border-radius:8px}
.pv td{font-size:1.6rem;font-weight:700;text-align:center;background:var(--tint);border-radius:10px;min-width:1.7em;padding:.1em .3em;color:var(--paper-ink)}
.pv td.hi{box-shadow:0 0 0 3px var(--pink-ink)}
mark.hi{background:var(--gold-soft);color:var(--pink-ink);border-radius:6px;padding:0 .1em;box-shadow:0 0 0 2px var(--gold)}
.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px #d9e5f2}
.tbl th,.tbl td{padding:.35em .9em;text-align:center;border-bottom:1px solid #e6eef8;font-size:1.05rem}
.tbl th{background:#e8f0fa;font-size:.88rem;color:var(--paper-dim)}

/* reading */
.reader{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;width:100%;align-items:start}
.passage{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 0 0 3px #e3ecf6;font-size:1.06rem;line-height:1.75;max-height:72vh;overflow:auto}
.passage h4{font-size:1.45rem;margin:0 0 .15em;color:var(--paper-ink)}
.passage .kind{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--pink-ink);margin:0 0 .6em}
.passage p{margin:0 0 .8em}
.passage .part-head{font-family:var(--font-display);font-size:1.15rem;margin:1em 0 .3em;color:var(--p4)}
.passage .poem p{margin:0 0 1em;line-height:1.6}
.passage .cast{font-size:.92rem;color:var(--paper-dim);font-style:italic}
.passage .who{font-weight:700;color:var(--p0)}
.passage em{color:var(--paper-dim)}
.s{border-radius:6px;padding:1px 2px;cursor:pointer;transition:background .15s,box-shadow .15s}
.s:hover{background:#eef4fb}
.prove .s{text-decoration:underline 2px dotted #b3c6dc;text-underline-offset:4px}
.s.picked{background:var(--coral-soft);box-shadow:0 0 0 2px var(--coral)}
.s.proof{background:var(--good-soft);box-shadow:0 0 0 2px #7fe0bd}
.s.glowev{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.s.reading{background:#e1f2ff;box-shadow:0 0 0 2px var(--sky)}
.qcard{display:flex;flex-direction:column;gap:12px;position:sticky;top:8px}
.qcard .qnum{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim)}
.qcard .qq{font-size:1.15rem;font-weight:600;line-height:1.45}
.skill-chip{align-self:flex-start;font-size:.72rem;font-weight:700;padding:.15em .6em;border-radius:6px;background:#e8f0fa;color:var(--p4)}
.prove-box{background:var(--gold-soft);border-radius:14px;padding:.7em 1em;font-weight:600;box-shadow:0 0 0 2px var(--gold)}
.gate{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 0 0 3px #e3ecf6}
.fuelbar{height:14px;border-radius:99px;background:#e8f0fa;overflow:hidden}
.fuelbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink))}
.listen-card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 0 0 3px #e3ecf6;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.listen-card h4{font-size:1.4rem}
.read-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mini{border:0;border-radius:999px;padding:.4em .9em;font-weight:600;font-size:.88rem;background:#e8f0fa;color:var(--paper-ink)}
.mini:hover{background:#d6e3f2}

/* tokens: capitals and commas */
.tokens{display:flex;flex-wrap:wrap;align-items:center;row-gap:10px;font-size:clamp(1.25rem,4.6vw,1.7rem);line-height:1.4;justify-content:center;max-width:720px}
.tok{border:0;background:#fff;border-radius:10px;padding:.08em .3em;font:inherit;font-weight:500;color:var(--paper-ink);box-shadow:0 0 0 2px #d9e5f2;margin:0 .18em}
.tok:hover{box-shadow:0 0 0 3px var(--lav)}
.tok.capd{box-shadow:0 0 0 3px var(--pink-ink);font-weight:700}
.tok.err{box-shadow:0 0 0 3px var(--coral-ink);background:var(--coral-soft)}
.tok.ok{box-shadow:0 0 0 3px var(--good-ink);background:var(--good-soft)}
.word{padding:.08em .05em;margin:0 .05em}
.gap{border:0;background:transparent;width:24px;height:1.6em;border-radius:8px;font:inherit;font-weight:800;color:var(--pink-ink);position:relative;padding:0}
.gap::before{content:"";position:absolute;left:50%;top:15%;bottom:15%;border-left:2px dotted #c2d3e6}
.gap:hover{background:#eef4fb}
.gap.on::before{content:",";border:0;left:0;right:0;top:0;bottom:0;display:grid;place-items:center;font-size:1.2em}
.gap.err{background:var(--coral-soft);box-shadow:0 0 0 2px var(--coral-ink)}
.gap.ok{background:var(--good-soft)}
.legend{font-size:.9rem;color:var(--paper-dim);text-align:center;margin:0}
.fixlist{margin:0;padding-left:1.2em;display:grid;gap:.3em}

/* bricks: syllables and spelling */
.brickrow{display:flex;flex-wrap:wrap;gap:4px 0;align-items:flex-end;justify-content:center;padding-top:10px}
.brick{position:relative;display:inline-flex;align-items:center;border-radius:6px;background:var(--bc,#ffb59a);color:#3a1205;font-weight:700;font-size:clamp(1.5rem,6vw,2.2rem);padding:.15em .25em;box-shadow:inset 0 -6px 0 #0002;margin:0 6px}
.brick::before{content:"";position:absolute;left:8px;right:8px;top:-9px;height:10px;background:radial-gradient(circle at 50% 100%,var(--bc,#ffb59a) 0 7px,transparent 8px) 0 0/26px 10px repeat-x}
.lt{padding:0 .02em}
.sgap{border:0;background:transparent;width:16px;align-self:stretch;border-radius:6px;padding:0;position:relative}
.sgap::after{content:"";position:absolute;left:50%;top:20%;bottom:20%;border-left:2px dotted #0003}
.sgap:hover{background:#ffffff88}
.brick-split{border:0;background:transparent;width:20px;align-self:stretch;padding:0;position:relative;border-radius:6px}
.brick-split:hover{background:#eef4fb}
.spell-in{font-family:var(--font-hand);font-size:clamp(1.6rem,6vw,2.3rem);padding:.25em .6em;border-radius:16px;border:3px solid var(--pink-ink);background:#fff;color:var(--paper-ink);width:min(100%,420px);text-align:center;letter-spacing:.06em}
.diff{display:flex;gap:2px;font-family:var(--font-hand);font-size:2rem;font-weight:700;justify-content:center;flex-wrap:wrap}
.diff span{padding:0 .08em;border-radius:6px}
.diff .g{color:var(--good-ink)}
.diff .b{color:var(--coral-ink);background:var(--coral-soft)}
.diff .m{color:var(--coral-ink);border-bottom:3px solid var(--coral-ink);min-width:.6em}
.eqn{font-size:clamp(1.4rem,5vw,2rem);font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.eqn .suf{color:var(--pink-ink)}
.rule-card{background:#fff;border-radius:14px;padding:.7em 1em;box-shadow:0 0 0 2px #d9e5f2;font-size:.98rem}

/* handwriting */
.print-wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px;align-items:center}
.print-wrap canvas{width:100%;height:auto;display:block;background:#fff;border-radius:16px;box-shadow:0 0 0 3px #e3ecf6;touch-action:none;cursor:crosshair}
.print-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.score{font-weight:700;font-size:1.05rem;text-align:center;min-height:1.5em}
.tips3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.tips3 div{background:#fff;border-radius:12px;padding:.5em .7em;font-size:.88rem;box-shadow:0 0 0 2px #d9e5f2}
.tips3 b{display:block;color:var(--p4)}
.paper-check{background:var(--gold-soft);border-radius:14px;padding:.8em 1em;box-shadow:0 0 0 2px var(--gold);width:100%}
.paper-check label{display:flex;gap:8px;align-items:center;margin-top:6px;font-weight:500}
.paper-check input{width:22px;height:22px;accent-color:var(--pink-ink)}

/* writing */
.wb{width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px}
.wb-prompt{background:var(--gold-soft);border-radius:16px;padding:.8em 1.1em;font-size:1.12rem;font-weight:600;box-shadow:0 0 0 2px var(--gold)}
.wb-step{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 0 0 3px #e3ecf6}
.wb-step.bad{box-shadow:0 0 0 3px var(--coral)}
.wb-step.good{box-shadow:0 0 0 3px #9fe5cc}
.wb-step label{font-weight:700;display:block}
.wb-step .tip{font-size:.88rem;color:var(--paper-dim);margin:0 0 6px}
.wb-step textarea{width:100%;font-family:var(--font-body);font-size:1.05rem;border-radius:12px;border:2px solid #cfdcec;padding:.55em .8em;min-height:3.4em;resize:vertical;background:#fdfbff;color:var(--paper-ink);line-height:1.5}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wchip{border:0;border-radius:999px;padding:.25em .75em;background:#e8f0fa;color:var(--paper-ink);font-size:.85rem;font-weight:600}
.wchip:hover{background:#d6e3f2}
.issues{margin:6px 0 0;padding-left:1.2em;font-size:.92rem;color:var(--coral-ink);display:grid;gap:2px}
.final{background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 0 0 3px #9fe5cc;font-size:1.1rem;line-height:1.7}
.final h4{font-size:1.4rem;margin-bottom:.3em}

/* done */
.done-card{max-width:620px;margin:20px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(170deg,var(--space-2),var(--space));border-radius:28px;padding:28px 20px;box-shadow:inset 0 0 0 2px var(--space-line)}
.launch{height:170px;display:grid;place-items:end center;width:100%;overflow:hidden;position:relative;border-bottom:14px solid;border-image:repeating-linear-gradient(90deg,#fff 0 14px,#111 14px 28px) 14}
.launch::after{content:"";position:absolute;right:18%;bottom:0;width:16px;height:120px;background:repeating-linear-gradient(#fff 0 16px,#111 16px 32px);border-radius:3px;opacity:.85}
.launch svg{width:150px;height:auto;overflow:visible;position:relative;z-index:1}
.launch.go svg{animation:finish 2.6s cubic-bezier(.3,.1,.4,1) .3s both}
@keyframes finish{0%{transform:translateX(-170%)}40%{transform:translateX(-10%) rotate(0)}55%{transform:translate(25%,-56px) rotate(-10deg)}70%{transform:translate(60%,0) rotate(4deg)}78%{transform:translate(70%,0) rotate(0)}100%{transform:translateX(70%)}}
.done-card h2{font-size:clamp(2rem,6vw,2.8rem)}
.done-stars{font-size:3rem;letter-spacing:.12em;color:var(--gold)}
.done-stars .off{color:var(--space-line)}
#done-msg{font-size:1.12rem;color:var(--ink-dim);max-width:42ch;margin:0}
.unlock{background:var(--space-3);border-radius:16px;padding:.7em 1.1em;font-weight:600;color:var(--mint);margin:0}
.done-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}


/* ---------- v3 additions ---------- */
.mini-pill{border:0;border-radius:999px;padding:.4em .85em;font-weight:600;font-size:.88rem;background:var(--space-3);color:var(--ink-dim);box-shadow:inset 0 0 0 2px var(--space-line)}
.mini-pill.on{background:var(--gold);color:#3a2700;box-shadow:none}
.mini-pill.light{background:#e8f0fa;color:var(--paper-ink);box-shadow:none}
.mini-pill.light.on{background:var(--pink-ink);color:#fff}
.msw{display:flex;flex-wrap:wrap;gap:6px}
.manual .msw{margin-top:6px}
.offidea{color:var(--ink-dim)}
details.gu-card summary{cursor:pointer;list-style-position:outside}
details.gu-card[open] summary{margin-bottom:.6em}
.settings{display:grid;gap:12px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--space-line)}
.set-row:last-child{border-bottom:0;padding-bottom:0}
.set-label{display:flex;flex-direction:column;min-width:0}
.set-label small{color:var(--ink-dim);font-size:.82rem}
@media (max-width:700px){
  .set-row{grid-template-columns:minmax(0,1fr)}
  table.cov,table.cov tbody,table.cov tr,table.cov td{display:block;width:100%}
  table.cov thead{display:none}
  table.cov tr{padding:10px 0;border-bottom:1px solid var(--space-line)}
  table.cov td{border:0;padding:.2em 0}
  table.cov tr.sub{padding:0;border:0;margin-top:10px}
  table.cov tr.sub td{padding:.5em .7em;border-radius:8px}
}
.hero-card{background:linear-gradient(120deg,#1f4a3a,var(--space-2));box-shadow:inset 0 0 0 2px var(--gold)}
.lvls.one{grid-template-columns:1fr}
.lvls.one .lv{font-size:1rem;padding:.7em}
.lvls.ch{grid-template-columns:repeat(5,1fr)}
.lvls.ch .lv{font-size:.7rem;padding:.45em .1em}
.lvls.ch .st{font-size:.7rem;letter-spacing:0}
.lv.locked{opacity:.5;cursor:default}
.lv.locked:hover{transform:none;box-shadow:inset 0 0 0 2px var(--space-line)}
/* homework helper */
.hw{width:100%;max-width:600px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.hw-ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hw-op{border:3px solid #cfdcec;background:#fff;border-radius:16px;padding:.4em .2em;font-family:var(--font-display);font-size:2.2rem;color:var(--paper-ink);display:flex;flex-direction:column;align-items:center;line-height:1}
.hw-op small{font-family:var(--font-body);font-size:.75rem;font-weight:600;margin-top:4px;color:var(--paper-dim)}
.hw-op.on{border-color:var(--pink-ink);background:#fff2ec}
.hw-nums{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.hw-nums label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem;flex:1;min-width:140px;color:var(--paper-dim)}
.hw-in{font:inherit;font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;padding:.2em .5em;border-radius:14px;border:3px solid #b9cbe0;background:#fff;color:var(--paper-ink);width:100%}
.hw-in:focus{border-color:var(--pink-ink);outline:none}
.hw-sym{font-family:var(--font-display);font-size:2.2rem;padding-bottom:.25em}
.hw-err{margin:0;color:var(--coral-ink);font-weight:600}
.hw .btn{align-self:center;font-size:1.1rem}
/* partial products */
.pp{display:grid;grid-template-columns:auto auto;gap:4px 16px;align-items:center;font-variant-numeric:tabular-nums}
.pp-n{justify-self:end;font-size:clamp(1.4rem,5vw,2rem);font-weight:700;display:flex;gap:.4em;align-items:center}
.pp-n .op{color:var(--paper-dim)}
.pp-done{color:var(--good-ink)}
.pp-q{color:#b3c6dc}
.pp-note{font-size:.95rem;color:var(--paper-dim);font-weight:600}
.pp-note.cur{color:var(--pink-ink)}
.pp-rule{grid-column:1/2;height:5px;background:var(--paper-ink);border-radius:3px}
/* lattice */
.lat{display:grid;grid-template-columns:repeat(var(--cols),var(--lc));grid-auto-rows:var(--lc);--lc:clamp(2.8rem,13vw,4.4rem);font-variant-numeric:tabular-nums}
.lat .hd{display:grid;place-items:center;font-weight:700;font-size:calc(var(--lc)*.5);color:var(--pc)}
.lat .cell{position:relative;background:#fff;box-shadow:inset 0 0 0 1.5px var(--paper-ink)}
.lat .cell.act{box-shadow:inset 0 0 0 3px var(--pink-ink)}
.lat .cell svg{position:absolute;inset:0;width:100%;height:100%}
.lat .tn,.lat .on{position:absolute;font-size:calc(var(--lc)*.34);font-weight:700;color:var(--paper-ink);padding:0 .1em;border-radius:6px}
.lat .tn{left:12%;top:6%}.lat .on{right:12%;bottom:6%}
.lat .typing{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--lc)*.4);font-weight:700}
.lat .gl{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.lat .res{display:grid;place-items:center;font-size:calc(var(--lc)*.42);font-weight:700;color:var(--good-ink);position:relative}
.lat .res .ghost{color:#b3c6dc}
.cry{position:absolute;top:2px;right:4px;font-size:.6em;color:var(--pink-ink)}
/* partial quotients */
.pq{display:grid;grid-template-columns:auto auto auto;gap:4px 12px;align-items:center;font-variant-numeric:tabular-nums;font-size:clamp(1.3rem,5vw,1.8rem);font-weight:700}
.pq-h{font-size:.75rem;color:var(--paper-dim);font-weight:700;text-align:center}
.pq-div{color:var(--pink-ink);display:flex;align-items:center;gap:2px;justify-self:end}
.pq-br{font-weight:400;font-size:1.3em;line-height:1}
.pq-n{justify-self:end;padding:0 .2em}
.pq-n.top{border-top:4px solid var(--paper-ink)}
.pq-n.under{border-bottom:4px solid var(--paper-ink)}
.pq-op{color:var(--paper-dim);justify-self:end}
.pq-g{justify-self:center;min-width:3em;text-align:center;color:var(--p4);background:#eef4fb;border-radius:10px;padding:0 .4em}
.pq-g:empty{background:transparent}
.pq-g.total{background:var(--good-soft);color:var(--good-ink);box-shadow:0 0 0 2px #9fe5cc}
.pq .rem{font-size:.7em;color:var(--pink-ink)}
.pqa{display:flex;align-items:stretch;gap:6px;width:100%;max-width:640px}
.pqa-side{display:grid;place-items:center;font-weight:700;font-size:1.4rem;color:var(--pink-ink)}
.pqa-row{display:flex;flex:1;min-height:110px;border:3px solid var(--paper-ink);border-radius:8px;overflow:hidden}
.pqa-box{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#e1f2ff;border-right:3px solid var(--paper-ink);padding:22px 4px 6px;min-width:58px}
.pqa-box:nth-child(even){background:#fde4f4}
.pqa-box.cur{background:#fff8d6}
.pqa-box b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.pqa-top{position:absolute;top:2px;font-weight:700;color:var(--p4);font-size:.95rem}
.pqa-left{display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#eef4fb 0 8px,#fff 8px 16px);font-weight:700;min-width:58px;padding:4px}
.pqa-left small{font-size:.75rem;color:var(--paper-dim)}
/* fact fuel-up */
.fsetup{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.fsetup>.btn{align-self:center}
.tbl-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;border:3px solid #cfdcec;background:#fff;border-radius:16px;padding:.8em 1em;color:var(--paper-ink);font:inherit}
.mode b{font-size:1.05rem}.mode span{font-size:.9rem;color:var(--paper-dim)}.mode small{color:var(--good-ink);font-weight:700}
.mode.on{border-color:var(--pink-ink);background:#fff2ec}
.frun{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:16px}
.fstat{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;font-size:1.05rem}
.fmeter{flex:1;height:14px;border-radius:99px;background:#e8f0fa;overflow:hidden;max-width:260px}
.fmeter.fuel{max-width:none;width:100%;flex:none}
.fmeter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .3s}
.shields{font-size:1.3rem;letter-spacing:.1em}.shields .lost{opacity:.2;filter:grayscale(1)}
.fact{font-size:clamp(2.6rem,12vw,4.4rem);font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
.fact .numbox{font-size:1em;min-width:1.6em;min-height:1.2em}
/* robot studio */
.rname{display:flex;flex-direction:column;gap:4px;font-weight:600;color:var(--ink-dim);width:100%;max-width:260px}
.rname input{font:inherit;font-size:1.1rem;padding:.45em .8em;border-radius:12px;border:2px solid var(--lav);background:var(--space);color:var(--ink)}
.studio{background:var(--space-2);border-radius:24px;padding:16px;box-shadow:inset 0 0 0 2px var(--space-line);display:flex;flex-direction:column;gap:12px}
.studio-tabs{display:flex;flex-wrap:wrap;gap:6px}
.studio-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ritem{border:0;border-radius:14px;padding:.6em .7em;background:var(--space);box-shadow:inset 0 0 0 2px var(--space-line);display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.ritem b{font-size:.95rem}.ritem small{font-size:.75rem;color:var(--ink-dim)}
.ritem.on{box-shadow:inset 0 0 0 3px var(--gold)}
.ritem.on small{color:var(--gold)}
.ritem.locked{opacity:.45;cursor:default}
.sw{width:100%;height:16px;border-radius:6px;margin-bottom:4px}
.sw[data-paint=""]{display:none}
#truck-preview{background:linear-gradient(#bfe3ff 0 62%,#7fcf7a 62% 100%);border-radius:24px;padding:10px 14px 4px;display:grid;place-items:center;width:100%}
#truck-preview svg{width:min(340px,100%);height:auto}
.truck-fields{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.rname.num{max-width:96px}
.lvls.two{grid-template-columns:repeat(2,1fr)}
.lv.allstar{box-shadow:inset 0 0 0 2px #ffd23f66}


/* turbo score extras */
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seqbox{min-width:3.2em;padding:.4em .5em;border-radius:12px;background:#fff;border:3px solid #cfdcec;font-size:1.5rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.seqbox.miss{border-style:dashed;border-color:var(--pink)}
.seqbox .numbox{font-size:1.3rem}
.pv-pair{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center}
.tok.glowtok{box-shadow:0 0 0 3px var(--gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffd23f88}}
.word.badw{background:#ffe1d6;border-radius:8px;padding:0 .2em;text-decoration:line-through;text-decoration-color:var(--pink-ink)}
.word.fixedw{background:var(--good-soft);color:var(--good-ink);border-radius:8px;padding:0 .2em;font-weight:700}
.launch .truck{width:190px}
@media (max-width:900px){
  .m-body{grid-template-columns:minmax(0,1fr)}
  .m-side{position:static}
  .reader{grid-template-columns:minmax(0,1fr)}
  .passage{max-height:none}
  .qcard{position:static}
  .hangar{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{order:-1}
  .trophies{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px}
  .plan-row{grid-template-columns:minmax(0,1fr)}
  .avatar{width:56px;height:56px}.avatar svg{width:44px;height:50px}
  .bubble{font-size:1rem}
  .notebook{padding:18px 10px}
  .tips3{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div id="app">
  <!-- HOME -->
  <section id="home">
    <div class="topbar">
      <p class="eyebrow">Turbo Score</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="star-total" title="Stars collected">★ <b id="star-count">0</b> stars</span>
        <button class="icon-btn" id="sound-home" type="button">Sound: on</button>
      </div>
    </div>
    <div class="hero">
      <div>
        <h1><span class="u">Turbo</span> <span class="r">Score</span></h1>
        <p class="lead">Race through math with Turbo the monster truck and build word skills with Brix. Every game earns stars for trophies and new parts for your truck.</p>
        <div class="pilot" id="pilot-view">
          <span class="pilot-name">Player: <span id="pilot-name">Champ</span></span>
          <button class="icon-btn" id="edit-name" type="button">Change name</button>
        </div>
        <form id="name-form" hidden>
          <label for="name-input" class="eyebrow" style="width:100%">Player name</label>
          <input id="name-input" maxlength="18" autocomplete="off" placeholder="Your name">
          <button class="btn btn-gold" type="submit">Save</button>
        </form>
      </div>
      <div class="hero-art">
        <svg class="rk bounce" viewBox="0 0 60 70" role="img" aria-label="Turbo the monster truck"><use href="#turbo"/></svg>
        <svg class="bt float2" viewBox="0 0 60 70" role="img" aria-label="Brix the brick buddy"><use href="#brix"/></svg>
      </div>
    </div>

    <div class="plan" id="plan"></div>

    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" type="button" data-tab="math" id="tab-math">Math Stadium</button>
      <button class="tab" role="tab" type="button" data-tab="words" id="tab-words">Word Speedway</button>
      <button class="tab" role="tab" type="button" data-tab="hangar" id="tab-hangar">Garage</button>
      <button class="tab" role="tab" type="button" data-tab="grownups" id="tab-grownups">For grown-ups</button>
    </div>
    <div class="pane" id="pane"></div>
  </section>

  <!-- MISSION -->
  <section id="mission" hidden>
    <div class="m-top">
      <button class="icon-btn" id="back" type="button">← Home</button>
      <div class="m-title"><p class="eyebrow" id="m-level">Rookie</p><h2 id="m-name">Mission</h2></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="fuel" aria-label="Laps finished"><span class="fuel-label">Laps</span><div class="fuel-cells" id="fuel"></div></div>
        <button class="icon-btn" id="sound-mission" type="button">Sound: on</button>
      </div>
    </div>
    <div class="m-body">
      <div class="m-main">
        <div class="helper" id="helper">
          <div class="avatar"><svg viewBox="0 0 60 70" aria-hidden="true"><use id="avatar-use" href="#turbo"/></svg></div>
          <div class="bubble" id="say" aria-live="polite"></div>
        </div>
        <div class="notebook" id="work"></div>
      </div>
      <aside class="m-side">
        <button class="btn btn-hot" id="next" type="button" hidden>Next problem →</button>
        <div class="pad" id="pad" hidden>
          <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
          <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
          <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
          <button type="button" data-k="back" class="k-back" aria-label="Erase">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="k-check">Check</button>
        </div>
        <div class="side-actions">
          <button class="btn btn-gold" id="hint" type="button">✨ Hint</button>
          <button class="btn" id="howto" type="button">How to</button>
        </div>
        <div class="manual" id="manual" hidden></div>
      </aside>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" hidden>
    <div class="done-card">
      <div class="launch" id="launch"><svg viewBox="0 0 60 70" aria-hidden="true"><use href="#turbo"/></svg></div>
      <p class="eyebrow">Game complete</p>
      <h2 id="done-title">Perfect game!</h2>
      <div class="done-stars" id="done-stars" aria-label="Stars earned"></div>
      <p id="done-msg"></p>
      <p class="unlock" id="done-unlock" hidden></p>
      <p class="unlock" id="done-part" hidden></p>
      <div class="done-actions">
        <button class="btn btn-hot" id="again" type="button">Play again</button>
        <button class="btn btn-gold" id="uplevel" type="button">Next level →</button>
        <button class="btn" id="go-home" type="button">Home</button>
      </div>
    </div>
  </section>
</div>
